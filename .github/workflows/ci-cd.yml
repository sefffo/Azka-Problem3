name: CI/CD — Azka Field Ops API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_NAME: 'Azka-field-ops-api'

jobs:

  # ─────────────────────────────────────────────────────────────────
  # JOB 1 · Build & Test  (runs on every push + PR)
  # Uses a local SQL Server container — real secrets live in Azure.
  # ─────────────────────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: AzkaStrong@123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P AzkaStrong@123! -Q 'SELECT 1' -No -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🏗️ Build (Release)
        run: dotnet build --no-restore -c Release

      - name: 🧪 Run tests
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=AzkaTestDb;User Id=sa;Password=AzkaStrong@123!;TrustServerCertificate=True;MultipleActiveResultSets=True"
          JwtSettings__SecretKey: "AzkaMaintenanceSystem-SuperSecretKey-2026-ChangeInProduction!"
          JwtSettings__Issuer: "AzkaMaintenanceAPI"
          JwtSettings__Audience: "AzkaMaintenanceClients"
          JwtSettings__ExpiryInMinutes: "1440"
          EmailSettings__Host: "smtp.gmail.com"
          EmailSettings__Port: "587"
          EmailSettings__FromName: "Azka Maintenance"
          EmailSettings__FromEmail: "noreply@ci.local"
          EmailSettings__Username: "noreply@ci.local"
          EmailSettings__Password: "ci-dummy-password"
        run: dotnet test --no-build -c Release --verbosity normal

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 · Deploy to Azure App Service  (push to main only)
  # Uses Publish Profile — no Entra ID / OIDC needed.
  # Real secrets (DB, JWT, Email) live in Azure App Service env vars.
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Azure
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore & Publish
        run: |
          dotnet restore
          dotnet publish Azka.Web/Azka.Web.csproj \
            -c Release \
            -o ./publish

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
