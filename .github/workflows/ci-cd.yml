name: CI/CD — Azka Field Ops API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  IMAGE_NAME: azka-field-ops-api

jobs:

  # ─────────────────────────────────────────────────────────────────
  # JOB 1 · Build & Test
  # ─────────────────────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: AzkaStrong@123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P AzkaStrong@123! -Q 'SELECT 1' -No -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🏗️ Build (Release)
        run: dotnet build --no-restore -c Release

      - name: 🧪 Run tests
        env:
          ConnectionStrings__DefaultConnection: >
            Server=localhost,1433;
            Database=AzkaTestDb;
            User Id=sa;
            Password=AzkaStrong@123!;
            TrustServerCertificate=True;
            MultipleActiveResultSets=True
          JwtSettings__SecretKey: "ci-test-secret-key-at-least-32-chars-long"
          JwtSettings__Issuer: "AzkaMaintenanceAPI"
          JwtSettings__Audience: "AzkaMaintenanceClients"
          JwtSettings__ExpiryInMinutes: "60"
        run: dotnet test --no-build -c Release --verbosity normal

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 · Docker Build & Push  (only on push to main)
  # ─────────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Docker Build & Push
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: 🐳 Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 · Deploy to Azure App Service  (only on push to main)
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Azure
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Publish
        run: |
          dotnet publish Azka.Web/Azka.Web.csproj \
            -c Release \
            -o ./publish \
            --no-restore

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
